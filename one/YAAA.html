<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>For You</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Caveat:wght@500&display=swap">

  <style>

    /* ==========================================
       WARNA & PENGATURAN DASAR
       ========================================== */
    :root {
      --bg1: #fdf1dc;
      --bg2: #f6d9c8;
      --ink: #8f2a2a;
      --soft: #a2776b;
      --card: rgba(255, 250, 245, 0.75);
      --key: #fbeadb;
      --ok: #c0504d;

      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg1: #2b1a1a;
        --bg2: #3a2220;
        --ink: #ffb4a8;
        --soft: #caa497;
        --card: rgba(60, 36, 34, 0.8);
        --key: #4a2d2a;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: linear-gradient(160deg, var(--bg1), var(--bg2));
      color: var(--ink);
      font-family: "Dancing Script", cursive;
      overflow: hidden;
    }


    /* ==========================================
       LAYAR (SCENE)
       ========================================== */
    .scene {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: auto;
      animation: fade 0.8s ease;
    }

    .scene.on {
      display: flex;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }


    /* ==========================================
       TEKS, TOMBOL, KARTU
       ========================================== */
    h1 {
      font-size: clamp(40px, 12vw, 72px);
      margin: 0;
    }

    .sub {
      font-family: Caveat, cursive;
      font-size: 22px;
      color: var(--soft);
      margin: 6px 0 18px;
    }

    .hero {
      font-size: 84px;
      margin: 10px;
    }

    .btn {
      font: inherit;
      font-size: 22px;
      color: #ffffff;
      background: var(--ok);
      border: 0;
      border-radius: 999px;
      padding: 8px 28px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(150, 40, 40, 0.3);
    }

    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 18px 22px;
      max-width: 420px;
      font-size: clamp(22px, 6vw, 28px);
      line-height: 1.6;
      box-shadow: 0 8px 30px rgba(120, 60, 40, 0.15);
    }

    .card b {
      font-weight: 700;
      border-radius: 6px;
      padding: 0 4px;
      background: linear-gradient(transparent 55%, rgba(240, 130, 150, 0.4) 55%);
    }

    .back {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 14px);
      right: 14px;
      z-index: 20;
      font-size: 18px;
      padding: 4px 16px;
    }


    /* ==========================================
       KELOPAK BUNGA JATUH
       ========================================== */
    #petals {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 5;
    }

    #petals span {
      position: absolute;
      top: -60px;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(115vh) rotate(360deg);
      }
    }


    /* ==========================================
       KEYPAD PASSKEY
       ========================================== */
    .dots {
      display: flex;
      gap: 14px;
      margin: 12px 0 20px;
    }

    .dots i {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--soft);
    }

    .dots i.f {
      background: var(--ok);
      border-color: var(--ok);
    }

    .pad {
      display: grid;
      grid-template-columns: repeat(3, 64px);
      gap: 12px;
    }

    .pad button {
      font: inherit;
      font-size: 26px;
      height: 64px;
      border-radius: 50%;
      border: 0;
      background: var(--key);
      color: var(--ink);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(120, 60, 40, 0.18);
    }

    .pad button:active {
      transform: scale(0.92);
    }

    .shake {
      animation: shake 0.4s;
    }

    @keyframes shake {
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }


    /* ==========================================
       LOADING
       ========================================== */
    .spin {
      font-size: 70px;
      animation: spin 1.6s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }


    /* ==========================================
       GALERI POLAROID
       ========================================== */
    #gallery {
      justify-content: flex-start;
      padding-top: 60px;
    }

    .board {
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
      justify-content: center;
      max-width: 760px;
      padding-bottom: 30px;
    }

    .pol {
      background: #ffffff;
      padding: 10px 10px 34px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      width: 140px;
      transition: transform 0.3s;
    }

    .pol:hover {
      transform: scale(1.08) rotate(0deg) !important;
      z-index: 2;
    }

    .pol .ph {
      width: 100%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      font-size: 44px;
    }

    .pol img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }


    /* ==========================================
       SURAT CINTA
       ========================================== */
    .letter {
      max-width: 460px;
      font-family: Caveat, cursive;
      font-size: 22px;
      line-height: 1.7;
      text-align: left;
      white-space: pre-line;
    }

    .end {
      font-size: clamp(34px, 10vw, 58px);
      margin-top: 26px;
    }

  </style>
</head>


<body>

  <!-- Kelopak bunga jatuh -->
  <div id="petals"></div>


  <!-- LAYAR 1: Intro -->
  <section class="scene on" id="s1">
    <div class="hero">🌹</div>
    <h1>From me to you.</h1>
    <p class="sub">This is how much I love you.</p>
    <button class="btn" data-go="s2">Open ♥</button>
  </section>


  <!-- LAYAR 2: Puisi -->
  <section class="scene" id="s2">
    <div class="card">
      In your <b>smile</b>, I found my <b>peace</b>.<br>
      In your <b>love</b>, I found my <b>home</b>.
    </div>

    <p class="sub" style="margin-top: 24px;">Masukkan passkey untuk lanjut</p>
    <button class="btn" data-go="s3">Lanjut</button>
  </section>


  <!-- LAYAR 3: Passkey -->
  <section class="scene" id="s3">
    <div style="font-size: 44px;">🔒</div>
    <h1 style="font-size: 40px;">Enter Passkey</h1>

    <div class="dots" id="dots">
      <i></i><i></i><i></i><i></i>
    </div>

    <div class="pad" id="pad"></div>
  </section>


  <!-- LAYAR 4: Loading -->
  <section class="scene" id="s4">
    <div class="spin">🌹</div>
    <p class="sub">LOADING</p>
  </section>


  <!-- LAYAR 5: Galeri foto -->
  <section class="scene" id="gallery">
    <button class="btn back" data-go="s2">‹ Back</button>

    <h1 style="font-size: 38px; margin-bottom: 14px;">Our Memories</h1>

    <div class="board" id="board"></div>

    <button class="btn" data-go="s6">Baca surat ♥</button>
  </section>


  <!-- LAYAR 6: Surat cinta -->
  <section class="scene" id="s6">
    <button class="btn back" data-go="gallery">‹ Back</button>

    <div class="card letter" id="letter"></div>

    <div class="end">I will always love you</div>
    <p class="sub">From, your forever</p>
  </section>



  <script>

    /* ==========================================
       BAGIAN YANG BOLEH KAMU UBAH
       ========================================== */

    // Passkey 4 digit
    const PASSKEY = "1234";

    // Isi surat
    const LETTER = `To My Dearest,

I am writing this little note just because you have been on my mind all day long. Every single time I think about your smile, my heart does a tiny happy dance.

Thank you for all the warm hugs, the soft giggles we share, and the beautiful comfort of knowing you are mine.

I count myself incredibly lucky to hold your hand and walk through life beside you.

Yours, Your Love`;

    // Foto: isi dengan nama file, contoh "foto1.jpg"
    // Pakai tanda kutip lurus " " dan pisahkan dengan koma.
    // Kalau kosong (null) atau gagal dimuat, tampil kotak placeholder.
    const PHOTOS = [
      null,
      null,
      null,
      null,
      null,
      null
    ];

    /* ========================================== */



    /* ==========================================
       FUNGSI BANTU
       ========================================== */
    const $ = (selector) => document.querySelector(selector);


    // Pindah antar layar
    function show(id) {
      document.querySelectorAll(".scene").forEach((scene) => {
        scene.classList.toggle("on", scene.id === id);
      });
    }

    document.querySelectorAll("[data-go]").forEach((button) => {
      button.onclick = () => show(button.dataset.go);
    });



    /* ==========================================
       KELOPAK BUNGA JATUH
       ========================================== */
    const petalEmojis = ["🌹", "🌸", "🥀", "🌷"];

    setInterval(() => {
      const petal = document.createElement("span");

      petal.textContent = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
      petal.style.left = Math.random() * 100 + "%";
      petal.style.fontSize = (16 + Math.random() * 22) + "px";
      petal.style.animationDuration = (6 + Math.random() * 6) + "s";

      $("#petals").append(petal);

      setTimeout(() => petal.remove(), 12000);
    }, 500);



    /* ==========================================
       KEYPAD PASSKEY
       ========================================== */
    let code = "";
    const pad = $("#pad");

    const keys = [1, 2, 3, 4, 5, 6, 7, 8, 9, "", 0, "⌫"];

    keys.forEach((key) => {
      const button = document.createElement("button");

      button.textContent = key;

      if (key === "") {
        button.style.visibility = "hidden";
      }

      button.onclick = () => press(key);
      pad.append(button);
    });


    // Warnai titik sesuai jumlah digit yang sudah diketik
    function paintDots() {
      [...$("#dots").children].forEach((dot, index) => {
        dot.classList.toggle("f", index < code.length);
      });
    }


    function press(key) {

      // Hapus satu digit
      if (key === "⌫") {
        code = code.slice(0, -1);
        paintDots();
        return;
      }

      // Maksimal 4 digit
      if (code.length >= 4) {
        return;
      }

      code += key;
      paintDots();

      // Cek passkey setelah 4 digit
      if (code.length === 4) {
        setTimeout(() => {

          if (code === PASSKEY) {
            show("s4");
            setTimeout(() => show("gallery"), 1800);
          } else {
            const dots = $("#dots");
            dots.classList.add("shake");
            setTimeout(() => dots.classList.remove("shake"), 400);
          }

          code = "";
          paintDots();

        }, 200);
      }
    }



    /* ==========================================
       GALERI POLAROID
       ========================================== */
    const tints = ["#f7c6c6", "#c6dff7", "#f7e4c6", "#d5f0cf", "#e5cff0", "#f7d9e8"];

    PHOTOS.forEach((src, index) => {
      const polaroid = document.createElement("div");
      polaroid.className = "pol";

      // Kemiringan acak
      const tilt = (Math.random() * 12 - 6).toFixed(1);
      polaroid.style.transform = "rotate(" + tilt + "deg)";

      // Kotak placeholder (dipakai kalau foto kosong atau gagal dimuat)
      const placeholder = document.createElement("div");
      placeholder.className = "ph";
      placeholder.style.background = tints[index % tints.length];
      placeholder.textContent = "📷";

      if (src) {
        const img = document.createElement("img");
        img.alt = "";
        img.src = src;
        img.onerror = () => img.replaceWith(placeholder);
        polaroid.append(img);
      } else {
        polaroid.append(placeholder);
      }

      $("#board").append(polaroid);
    });



    /* ==========================================
       ISI SURAT
       ========================================== */
    $("#letter").textContent = LETTER;

  </script>

</body>
</html>
