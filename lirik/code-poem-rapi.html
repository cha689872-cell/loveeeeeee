<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Code Poem</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #000;
      --foreground: #f2f2f2;
      --dim: #6b6b6b;
      --red: #ff3b30;
      --function: #e8c24a;
      --string: #e8975a;
      --key: #6fb3e0;
      --punctuation: #d9d9d9;
      --comment: #6fbf73;
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    body {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 100svh;
      margin: 0;
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--background);
      color: var(--foreground);
      font-family: "JetBrains Mono", "Fira Code", ui-monospace, Menlo, Consolas, monospace;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #stage {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: 0 6vw;
    }

    #view {
      width: 100%;
      max-width: 900px;
      font-size: clamp(14px, 4vw, 30px);
      line-height: 2;
      transition: opacity 1s ease;
    }

    .line {
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      opacity: 0.95;
      transition: opacity 0.6s ease, filter 0.6s ease;
    }

    .line.age-1 {
      opacity: 0.45;
      filter: blur(0.6px);
    }

    .line.age-2 {
      opacity: 0.2;
      filter: blur(1.4px);
    }

    .line.age-3 {
      opacity: 0;
    }

    .line.current {
      text-shadow: 0 0 14px rgb(255 255 255 / 18%);
    }

    i {
      font-style: normal;
    }

    .token-red { color: var(--red); }
    .token-function { color: var(--function); }
    .token-string { color: var(--string); }
    .token-key { color: var(--key); }
    .token-punctuation { color: var(--punctuation); }
    .token-comment { color: var(--comment); }

    .current .token-key,
    .current .token-function,
    .current .token-string {
      filter: brightness(1.25);
    }

    .glitch {
      color: var(--red);
      text-shadow: 2px 0 #0ff, -2px 0 var(--red);
    }

    .cursor {
      display: inline-block;
      width: 0.6em;
      height: 1.15em;
      margin-left: 2px;
      border-radius: 2px;
      background: var(--red);
      box-shadow: 0 0 12px var(--red);
      vertical-align: -0.2em;
      animation: blink 1s steps(1) infinite;
    }

    #hint {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      right: 0;
      left: 0;
      color: var(--dim);
      font-size: 11px;
      text-align: center;
      opacity: 0.6;
      pointer-events: none;
    }

    @keyframes blink {
      50% { opacity: 0.15; }
    }

    @media (max-width: 480px) {
      #stage {
        padding-right: 5vw;
        padding-left: 5vw;
      }

      #view {
        font-size: clamp(13px, 4vw, 20px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="hint">tap anywhere to restart</div>

  <main id="stage">
    <div id="view" aria-live="polite" aria-label="Animated code poem"></div>
  </main>

  <script>
    // Edit your poem here: each array item becomes one animated line.
    const LINES = [
      'why.cant( "i_rest" ){ stitch: "the_noise_to_quiet" };',
      'why.does( "night" ){ feel: "longer_than_me" };',
      '// .........',
      'i.carry( "the_weight" ){ but: "not_alone" };',
      'my_mind{ is_full_of: "static" };',
      'maybe.try( "one_more_day" ){ be: "kind_to_self" };',
      'tomorrow{ is_not: "today" };',
      'you.are( "still_here" ){ and: "that_counts" };'
    ];

    const view = document.getElementById("view");

    /**
     * Escape source text before adding syntax-highlight markup.
     * This keeps the displayed poem safe and prevents HTML in a line
     * from being interpreted by the browser.
     */
    function highlightSyntax(source) {
      const escaped = source
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      const tokenPattern =
        /(\/\/.*$)|("[^"]*"?)|\b([a-z_]+)(?=\.)|\b([a-z_]+)(?=\()|\b([a-z_]+)(?=:)|([(){};.,:])/g;

      return escaped.replace(
        tokenPattern,
        (match, comment, string, red, fn, key, punctuation) => {
          if (comment) {
            return `<i class="token-comment">${comment}</i>`;
          }

          if (string) {
            return `<i class="token-string">${string}</i>`;
          }

          if (red) {
            return `<i class="token-red">${red}</i>`;
          }

          if (fn) {
            return `<i class="token-function">${fn}</i>`;
          }

          if (key) {
            return `<i class="token-key">${key}</i>`;
          }

          return `<i class="token-punctuation">${punctuation}</i>`;
        }
      );
    }

    const wait = (milliseconds) =>
      new Promise((resolve) => setTimeout(resolve, milliseconds));

    let playbackId = 0;

    async function playPoem() {
      const currentPlayback = ++playbackId;

      view.style.opacity = "1";
      view.innerHTML = "";

      await wait(600);

      const visibleLines = [];

      for (const text of LINES) {
        if (currentPlayback !== playbackId) return;

        const lineElement = document.createElement("div");
        lineElement.className = "line current";

        view.appendChild(lineElement);
        visibleLines.push(lineElement);

        // Fade older lines as the next line appears.
        visibleLines.forEach((element, index) => {
          const age = visibleLines.length - 1 - index;

          element.classList.remove("age-1", "age-2", "age-3");

          if (age === 1) {
            element.classList.add("age-1");
          } else if (age === 2) {
            element.classList.add("age-2");
          } else if (age >= 3) {
            element.classList.add("age-3");
          }

          if (age > 0) {
            element.classList.remove("current");
          }
        });

        // Keep the DOM small by removing older hidden lines.
        while (view.children.length > 5) {
          view.removeChild(view.firstElementChild);
        }

        let typedText = "";

        function render(extra = "") {
          lineElement.innerHTML =
            highlightSyntax(typedText) +
            extra +
            '<span class="cursor" aria-hidden="true"></span>';
        }

        render();

        // Type each character with a small random delay.
        for (const character of text) {
          if (currentPlayback !== playbackId) return;

          // Briefly show a corrupted character for a glitch effect.
          if (Math.random() < 0.04 && /[a-z]/.test(character)) {
            const glitchCharacters = "#@%&Z~?";
            const wrongCharacter =
              glitchCharacters[Math.floor(Math.random() * glitchCharacters.length)];

            render(`<i class="glitch">${wrongCharacter}</i>`);
            await wait(110);

            if (currentPlayback !== playbackId) return;

            render();
            await wait(70);
          }

          typedText += character;
          render();

          let delay = 45 + Math.random() * 70;

          if (/[(){};:,.]/.test(character)) {
            delay += 70;
          }

          if (character === " ") {
            delay += 40;
          }

          await wait(delay);
        }

        lineElement.querySelector(".cursor")?.remove();
        await wait(750);
      }

      if (currentPlayback !== playbackId) return;

      await wait(2200);
      view.style.opacity = "0";

      await wait(1100);

      if (currentPlayback === playbackId) {
        playPoem();
      }
    }

    // Tap or click anywhere to restart the animation.
    document.addEventListener("pointerdown", playPoem);

    // Start automatically when the page opens.
    playPoem();
  </script>
</body>
</html>
