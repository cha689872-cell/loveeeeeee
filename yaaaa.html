<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For You</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Caveat:wght@500&display=swap">
<style>
:root{--bg1:#fdf1dc;--bg2:#f6d9c8;--ink:#8f2a2a;--soft:#a2776b;--card:rgba(255,250,245,.75);--key:#fbeadb;--ok:#c0504d;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b1a1a;--bg2:#3a2220;--ink:#ffb4a8;--soft:#caa497;--card:rgba(60,36,34,.8);--key:#4a2d2a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:"Dancing Script",cursive;overflow:hidden}
.scene{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:auto;animation:fade .8s ease}
.scene.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1{font-size:clamp(40px,12vw,72px);margin:0}
.sub{font-family:Caveat,cursive;font-size:22px;color:var(--soft);margin:6px 0 18px}
.btn{font:inherit;font-size:22px;color:#fff;background:var(--ok);border:0;border-radius:999px;padding:8px 28px;cursor:pointer;box-shadow:0 4px 14px rgba(150,40,40,.3)}
.hero{font-size:84px;margin:10px}
.card{background:var(--card);border-radius:18px;padding:18px 22px;max-width:420px;font-size:clamp(22px,6vw,28px);line-height:1.6;box-shadow:0 8px 30px rgba(120,60,40,.15)}
.card b{font-weight:700;border-radius:6px;padding:0 4px;background:linear-gradient(transparent 55%,rgba(240,130,150,.4) 55%)}
#petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
#petals span{position:absolute;top:-60px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
/* keypad */
.dots{display:flex;gap:14px;margin:12px 0 20px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--soft)}
.dots i.f{background:var(--ok);border-color:var(--ok)}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:12px}
.pad button{font:inherit;font-size:26px;height:64px;border-radius:50%;border:0;background:var(--key);color:var(--ink);cursor:pointer;box-shadow:0 2px 6px rgba(120,60,40,.18)}
.pad button:active{transform:scale(.92)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
/* loader */
.spin{font-size:70px;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* gallery */
#gallery{justify-content:flex-start;padding-top:60px}
.board{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;max-width:760px;padding-bottom:30px}
.pol{background:#fff;padding:10px 10px 34px;box-shadow:0 8px 20px rgba(0,0,0,.2);width:140px;transition:transform .3s}
.pol:hover{transform:scale(1.08) rotate(0)!important;z-index:2}
.pol .ph{width:100%;aspect-ratio:1;display:grid;place-items:center;font-size:44px;background-size:cover;background-position:center}
.pol img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;z-index:6;font-size:18px;padding:4px 16px}
/* letter */
.letter{max-width:460px;font-family:Caveat,cursive;font-size:22px;line-height:1.7;text-align:left;white-space:pre-line}
.end{font-size:clamp(34px,10vw,58px);margin-top:26px}
</style>
</head>
<body>
<div id="petals"></div>

<section class="scene on" id="s1">
  <div class="hero">🌹</div>
  <h1>From me to you.</h1>
  <p class="sub">This is how much I love you.</p>
  <button class="btn" data-go="s2">Open ♥</button>
</section>

<section class="scene" id="s2">
  <div class="card">In your <b>smile</b>, I found my <b>peace</b>.<br>In your <b>love</b>, I found my <b>home</b>.</div>
  <p class="sub" style="margin-top:24px">Masukkan passkey untuk lanjut</p>
  <button class="btn" data-go="s3">Lanjut</button>
</section>

<section class="scene" id="s3">
  <div style="font-size:44px">🔒</div>
  <h1 style="font-size:40px">Enter Passkey</h1>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pad"></div>
</section>

<section class="scene" id="s4">
  <div class="spin">🌹</div>
  <p class="sub">LOADING</p>
</section>

<section class="scene" id="gallery">
  <button class="btn back" data-go="s2">‹ Back</button>
  <h1 style="font-size:38px;margin-bottom:14px">Our Memories</h1>
  <div class="board" id="board"></div>
  <button class="btn" data-go="s6">Baca surat ♥</button>
</section>

<section class="scene" id="s6">
  <button class="btn back" data-go="gallery">‹ Back</button>
  <div class="card letter" id="letter"></div>
  <div class="end">I will always love you</div>
  <p class="sub">From, your forever</p>
</section>

<script>
/* ====== EDIT HERE ====== */
const PASSKEY = "1234";
const LETTER = `To My Dearest,

I am writing this little note just because you have been on my mind all day long. Every single time I think about your smile, my heart does a tiny happy dance.

Thank you for all the warm hugs, the soft giggles we share, and the beautiful comfort of knowing you are mine.

I count myself incredibly lucky to hold your hand and walk through life beside you.

Yours, Your Love`;
// isi dengan foto kamu: "foto1.jpg" atau URL data:. Kosong = placeholder.
const PHOTOS = [null,null,null,null,null,null];
/* ======================= */

const $ = s => document.querySelector(s);
function show(id){document.querySelectorAll('.scene').forEach(e=>e.classList.toggle('on',e.id===id))}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));

// falling petals
const em=['🌹','🌸','🥀','🌷'];
setInterval(()=>{
  const s=document.createElement('span');
  s.textContent=em[Math.random()*em.length|0];
  s.style.left=Math.random()*100+'%';
  s.style.fontSize=(16+Math.random()*22)+'px';
  s.style.animationDuration=(6+Math.random()*6)+'s';
  $('#petals').append(s); setTimeout(()=>s.remove(),12000);
},500);

// keypad
let code="";
const pad=$('#pad');
[1,2,3,4,5,6,7,8,9,'',0,'⌫'].forEach(k=>{
  const b=document.createElement('button');
  b.textContent=k; if(k==='')b.style.visibility='hidden';
  b.onclick=()=>press(k); pad.append(b);
});
function paint(){[...$('#dots').children].forEach((d,i)=>d.classList.toggle('f',i<code.length))}
function press(k){
  if(k==='⌫'){code=code.slice(0,-1);paint();return}
  if(code.length>=4)return;
  code+=k; paint();
  if(code.length===4){
    setTimeout(()=>{
      if(code===PASSKEY){show('s4');setTimeout(()=>show('gallery'),1800)}
      else{const d=$('#dots');d.classList.add('shake');setTimeout(()=>d.classList.remove('shake'),400)}
      code="";paint();
    },200);
  }
}

// polaroids
const tints=['#f7c6c6','#c6dff7','#f7e4c6','#d5f0cf','#e5cff0','#f7d9e8'];
PHOTOS.forEach((src,i)=>{
  const p=document.createElement('div');p.className='pol';
  p.style.transform=`rotate(${(Math.random()*12-6).toFixed(1)}deg)`;
  p.innerHTML=src?`<img src="${src}" alt="">`:`<div class="ph" style="background:${tints[i%6]}">📷</div>`;
  $('#board').append(p);
});
$('#letter').textContent=LETTER;
</script>
</body>
</html>
